<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>통계 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽 세로 단계 탭(통계적 문제해결 4단계) + 오른쪽 작업 영역. 그래프·보고서 카드는 캡처용으로 독립된 흰 판 */
:root{
  --bg:#eef2f5; --panel:#ffffff; --panel2:#f6f8fa; --ink:#16202a; --muted:#5a6775; --line:#d9e0e7; --grid:#e8edf2;
  --accent:#0d6b6e; --accent-soft:#dcefee; --accent-ink:#ffffff;
  --g1:#2f6fdb; --g2:#e0731a; --g3:#2a9a58; --g4:#9a4dd0;
  --warn:#9a5b00; --warn-soft:#fff3dd; --mark:#ffe58a;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"D2Coding",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151b; --panel:#182028; --panel2:#1d2630; --ink:#e5ebf1; --muted:#9aa8b6; --line:#2a3541; --grid:#222c37;
  --accent:#4cc2b7; --accent-soft:#163b3b; --accent-ink:#06201f;
  --g1:#6f9ff2; --g2:#f39a50; --g3:#5bc98a; --g4:#c28bf0;
  --warn:#f1bb5c; --warn-soft:#33270f; --mark:#6b5a12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#182028; --panel2:#1d2630; --ink:#e5ebf1; --muted:#9aa8b6; --line:#2a3541; --grid:#222c37;
  --accent:#4cc2b7; --accent-soft:#163b3b; --accent-ink:#06201f;
  --g1:#6f9ff2; --g2:#f39a50; --g3:#5bc98a; --g4:#c28bf0;
  --warn:#f1bb5c; --warn-soft:#33270f; --mark:#6b5a12; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r);padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.step:hover{background:var(--panel2);color:var(--ink)}
.step .no{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex:none}
.step[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:transparent;font-weight:600}
.step[aria-selected="true"] .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);padding:0 6px}
.linkbtn{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;font-size:12.5px}
.linkbtn:hover{color:var(--ink)}

/* ---------- main ---------- */
.main{padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* problem */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;width:100%;resize:vertical}
.field textarea{min-height:70px}
.hint-box{background:var(--panel2);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--muted)}
.hint-box b{color:var(--ink)}

/* collect */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.src{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.src:hover{border-color:var(--accent)}
.src.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.src .tag{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);letter-spacing:.04em}
.src b{font-size:15px;line-height:1.35}
.src span{font-size:12.5px;color:var(--muted)}
.src input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
[hidden]{display:none!important}
.srcwrap{position:relative;min-width:0;display:flex}
.srcwrap>.src{flex:1;width:100%}
.prephead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prepmenu{position:absolute;top:calc(100% + 6px);right:0;width:max(100%,340px);max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.pmitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.pmitem:hover,.pmitem:focus-visible{background:var(--panel2);outline:none}
.pmitem.cur{background:var(--accent-soft)}
.pmn{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pmsep{border-top:1px solid var(--line);margin:4px 6px}
.pmnote{margin:0;padding:6px 10px 4px;font-size:12px;color:var(--muted)}
.confirm{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
.confirm .cbtns{display:flex;gap:8px}
.drop{outline:2px dashed var(--accent);outline-offset:6px;border-radius:var(--r)}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tbar .grow{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:0}
.tbar .grow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;font-weight:600}
.tablewrap{position:relative;overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.fillh{position:absolute;width:11px;height:11px;background:var(--accent);border:2px solid var(--panel);border-radius:2px;cursor:crosshair;touch-action:none;z-index:1}
@media (pointer:coarse){.fillh{width:20px;height:20px;margin:-4px 0 0 -4px}}
.dt td:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.dt td.fillsel,.dt td.fillsel input{background:var(--accent-soft)}
.dt td.fillsel{box-shadow:inset 0 0 0 1px var(--accent)}
table.dt{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
.dt th,.dt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.dt thead{position:sticky;top:0;z-index:2}
.dt thead th{background:var(--panel2)}
.dt .urow input{font-weight:400;font-size:13px;color:var(--muted);padding:4px 10px}
.dt .urow .rn{font-family:var(--f-body);font-size:11.5px}
.dt input{border:0;background:transparent;padding:7px 10px;width:100%;min-width:110px}
.dt thead input{font-weight:600}
.dt td input:focus,.dt th input:focus{background:var(--accent-soft);outline:none}
.dt .rn{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;width:44px;min-width:44px;padding:0 6px;background:var(--panel2)}
.dt .x{width:34px;min-width:34px;text-align:center}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:16px;line-height:1}
.xbtn:hover{background:var(--warn-soft);color:var(--warn)}
.hcell{display:flex;align-items:center}

/* analyze */
.ctl{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center}
.sel{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sel select,.sel input{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 9px;font-weight:500}
.sel input{width:84px;font-family:var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;background:var(--panel);cursor:pointer}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.tools{display:flex;flex-wrap:wrap;gap:10px 22px;padding-top:14px;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg-l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-right:2px}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.tb:hover:not(:disabled){border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb:disabled{opacity:.38;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg .tb{border:0;border-radius:0}
.seg .tb+.tb{border-left:1px solid var(--line)}
.note{font-size:13px;color:var(--muted)}
.warnline{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:7px 11px;border-radius:8px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat h4{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.sv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sv .gname{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;min-width:3.5em}
.sv .gname i{width:9px;height:9px;border-radius:50%}
.sv .num{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sv .unit{font-size:13px;color:var(--muted)}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
details .proc{margin-top:6px;display:flex;flex-direction:column;gap:6px;line-height:1.6}
.seq{font-family:var(--f-mono);font-size:12.5px;word-break:break-word}
.seq mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

.view{padding:20px 22px 22px}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 18px;flex-wrap:wrap;margin-bottom:12px}
.vhead h3{margin:0;font-size:18px;letter-spacing:-.01em;text-wrap:balance}
.vhead .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.svgwrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;min-width:420px}
svg .axis{stroke:var(--ink);stroke-width:1.2}
svg .gridl{stroke:var(--grid);stroke-width:1}
svg .tick{fill:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
svg .alabel{fill:var(--muted);font-size:12.5px;font-family:var(--f-body)}
svg .vlabel{font-size:12px;font-family:var(--f-mono);font-weight:600}
svg .gtitle{fill:var(--ink);font-size:14px;font-weight:600;font-family:var(--f-body)}
.c0{--c:var(--g1)} .c1{--c:var(--g2)} .c2{--c:var(--g3)} .c3{--c:var(--g4)}
svg .bar{fill:var(--c);stroke:var(--c);stroke-width:1.4}
svg .poly{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linejoin:round}
svg .pt{fill:var(--c);stroke:var(--panel);stroke-width:1.6}
svg .vlabel{fill:var(--c)}
svg .brk{fill:none;stroke:var(--ink);stroke-width:1.3}
svg .brkbg{fill:var(--panel)}
svg .axdrag{fill:transparent;touch-action:none}
svg .axdrag.xd{cursor:ew-resize}
svg .axdrag.yd{cursor:ns-resize}
svg .axdrag:hover{fill:var(--accent);fill-opacity:.08}
svg .draginfo{fill:var(--accent);font-size:13.5px;font-weight:600;font-family:var(--f-body)}
body.capture svg .axdrag{display:none}
svg .whisk{stroke:var(--c);stroke-width:2}
svg .bx{fill:var(--c);fill-opacity:.2;stroke:var(--c);stroke-width:2}
svg .medl{stroke:var(--c);stroke-width:3.5}
svg .dot{fill:var(--c);fill-opacity:.72;stroke:var(--panel);stroke-width:1.2}
.sepcharts{display:flex;flex-direction:column;gap:14px}

table.ft{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:0 auto;font-size:15px}
.ft th,.ft td{border:1px solid var(--line);padding:7px 16px;text-align:center}
.ft thead th{background:var(--panel2);font-weight:600}
.ft tfoot td{font-weight:600;background:var(--panel2)}
.ft td.num{font-family:var(--f-mono)}
.ft .gh{display:inline-flex;align-items:center;gap:6px}
.ft .gh i{width:9px;height:9px;border-radius:50%}
.tables{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;overflow-x:auto}
table.sl{border-collapse:collapse;font-family:var(--f-mono);font-size:16px;margin:0 auto}
.sl th{font-family:var(--f-body);font-size:13.5px;font-weight:600;padding:6px 14px;border-bottom:1.5px solid var(--ink)}
.sl td{padding:4px 14px;white-space:pre}
.sl td.stem{border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);text-align:center;font-weight:600}
.sl td.stem.only{border-left:0}
.sl td.lf{letter-spacing:.06em}
.sl td.lf.left{text-align:right}
.slkey{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
.slbox{display:flex;flex-direction:column;align-items:center}
.slbox h5{margin:0 0 6px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.slbox h5 i{width:9px;height:9px;border-radius:50%}

/* result */
.report{padding:26px 28px;display:flex;flex-direction:column;gap:22px}
.rp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rp-head h2{margin:0;font-size:22px;letter-spacing:-.01em}
.rp-head .who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.rp-head .who input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;width:200px;max-width:50vw;font-weight:600;color:var(--ink)}
.rsec{display:flex;flex-direction:column;gap:10px}
.rsec h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.rsec h3 .no{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500}
.rp-view{border:1px solid var(--line);border-radius:var(--r);padding:16px}
.concl{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px 14px;min-height:130px;width:100%;resize:vertical;line-height:1.7;font-size:15px}
.prompts{display:flex;flex-wrap:wrap;gap:8px}
.prompts button{border:1px dashed var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.prompts button:hover{color:var(--ink);border-color:var(--accent)}

/* capture mode */
.cap-exit{display:none}
body.capture .side,body.capture .no-cap{display:none!important}
body.capture .app{grid-template-columns:minmax(0,1fr)}
body.capture .main{margin:0 auto;max-width:1000px}
body.capture .cap-exit{display:inline-flex;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:40}

@media (max-width:900px){ .srcs{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
  .brand,.side-foot{display:none}
  .steps{flex-direction:row;gap:4px}
  .step{padding:8px 10px;white-space:nowrap;gap:8px;font-size:14px}
  .step .no{width:22px;height:22px;font-size:12px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 50px}
  .form{grid-template-columns:minmax(0,1fr)}
  .report{padding:18px 16px}
  .view{padding:16px 14px}
}
@media (max-width:420px){ .srcs{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .step,.tb,.src,.chip{transition:background .15s,border-color .15s,color .15s} }
</style>

</head>
<body>
<div class="app">
  <nav class="side" aria-label="탐구 단계">
    <div class="brand"><b>통계 탐구실</b><span>문제 설정부터 결과 해석까지</span></div>
    <ul class="steps" role="tablist">
      <li><button class="step" role="tab" data-tab="problem" id="t-problem"><span class="no">1</span>문제 설정</button></li>
      <li><button class="step" role="tab" data-tab="collect" id="t-collect"><span class="no">2</span>자료 수집</button></li>

    problem:{topic:"우리 학교 학생들이 좋아하는 동물",question:"A중학교 1학년과 2학년 학생들이 가장 좋아하는 동물은 같을까?",target:"A중학교 1학년 30명, 2학년 30명",variable:"좋아하는 동물",method:"학급 설문 조사 (가상 자료)",guess:""},

    rows:[20,25,35,40,45,46,50,55,56,56,57,60,60,60,62,62,63,64,65,65,65,66,66,68,69,70,71,75].map((v,i)=>[String(i+1),String(v)]),
    problem:null,clearProblem:true,sel:{}},
  blank:{title:"우리 반 자료",columns:["번호","집단","변량"],units:["","",""],rows:Array.from({length:10},()=>["","",""]),problem:null,sel:{}}
};
const PROBLEM_FIELDS=[
  ["topic","탐구 주제","예: 우리 학교 1학년 학생들의 키",false],
  ["question","통계적 질문","예: 1반과 2반 중 어느 반 학생들의 키가 더 큰 편일까?",true],
  ["target","조사 대상","예: A중학교 1학년 1반 25명, 2반 28명",false],
  ["variable","조사할 변량 (단위)","예: 키(cm)",false],
  ["method","자료 수집 방법","예: 설문 조사, 직접 측정, 공공 데이터",false],
  ["guess","예상해 보기","자료를 모으기 전에 결과를 예상하고 그 까닭을 적어 보세요.",true]
];
const KEY="tonggye-tamgu-v3";
const clone=o=>JSON.parse(JSON.stringify(o));

function freshState(){
  const e=EX.blank;
  return {tab:"problem",dataKey:"blank",problemFromEx:false,
    problem:{},
    data:{title:e.title,columns:clone(e.columns),units:clone(e.units),rows:clone(e.rows)},
    an:{valueCol:-1,groupCol:-2,sel:clone(e.sel),cunit:"명",rel:false,mode:"overlay",start:"",width:"",stats:{mean:true,median:false,mode:false},off:[]},
    result:{who:"",text:""}};
}
let S;
try{ localStorage.removeItem("tonggye-tamgu-v1"); localStorage.removeItem("tonggye-tamgu-v2"); }catch(e){}
try{ const raw=sessionStorage.getItem(KEY); S=raw?JSON.parse(raw):null; }catch(e){ S=null; }
if(!S||!S.data||!S.an) S=freshState();
if(!S.data.units) S.data.units=[];
if(!S.an.cunit) S.an.cunit="명";
if(!S.an.sel){ const v=S.an.view,l=S.an.layers||{}; S.an.sel={stem:v==="stem",table:v==="table",hist:v==="chart"&&!!l.hist,poly:v==="chart"&&!!l.poly,box:v==="box",scatter:v==="scatter"}; }
if(S.dataKey==="height"&&S.data.columns.length===3&&S.data.columns[2]==="키(cm)"){ S.data.columns=clone(EX.height.columns); S.data.rows=clone(EX.height.rows); }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){} },250); }

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=s=>/^\s*-?\d+(\.\d+)?\s*$/.test(String(s??""));
const rnd=x=>Math.round(x*1e9)/1e9;
function fmt(x,d=2){ const p=10**d; const r=Math.round(x*p)/p; return String(r); }
function unitOf(name){ const m=String(name).match(/\(([^)]+)\)\s*$/); return m?m[1]:""; }
function getUnit(ci){ const u=S.data.units&&S.data.units[ci]; return (u&&String(u).trim())||unitOf(S.data.columns[ci]||""); }
function colLabel(ci){ const u=getUnit(ci), n=bareName(S.data.columns[ci]||""); return u?`${n}(${u})`:n; }
function cU(){ return (S.an.cunit||"").trim()||"명"; }
function bareName(name){ return String(name).replace(/\s*\([^)]*\)\s*$/,"").trim()||String(name); }
let toastT;
function toast(msg){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

function colStats(ci){
  const vals=S.data.rows.map(r=>String(r[ci]??"").trim()).filter(v=>v!=="");
  const nums=vals.filter(isNum);
  return {n:vals.length,numeric:vals.length>0&&nums.length/vals.length>=0.9,distinct:new Set(vals).size};
}
function ensureAn(){
  const cols=S.data.columns, an=S.an;
  if(an.valueCol<0||an.valueCol>=cols.length){
    let pick=-1;
    for(let i=0;i<cols.length;i++){ if(/번호|^no$|^id$/i.test(cols[i]))continue; const st=colStats(i); if(st.n&&st.numeric){pick=i;break;} }
    if(pick<0){ for(let i=cols.length-1;i>=0;i--){ if(/번호|^no$|^id$/i.test(cols[i]))continue; if(colStats(i).n){pick=i;break;} } }
    an.valueCol=pick<0?cols.length-1:pick;
  }
  if(an.groupCol>=cols.length||an.groupCol===an.valueCol) an.groupCol=-1;
  if(an.groupCol===-2){ // auto
    an.groupCol=-1;
    for(let i=0;i<cols.length;i++){ if(i===an.valueCol||/번호/.test(cols[i]))continue; const st=colStats(i); if(st.distinct>=2&&st.distinct<=4&&!st.numeric){an.groupCol=i;break;} }
  }
  const numCols=cols.map((_,i)=>i).filter(i=>i!==an.valueCol&&!/번호|^no$|^id$/i.test(cols[i])&&colStats(i).n&&colStats(i).numeric);
  if(an.yCol===undefined||!numCols.includes(an.yCol)) an.yCol=numCols.length?numCols[0]:-1;
}
function numericCols(except){ return S.data.columns.map((_,i)=>i).filter(i=>i!==except&&!/번호|^no$|^id$/i.test(S.data.columns[i])&&colStats(i).n&&colStats(i).numeric); }
/* 집단별 자료 */
function getGroups(){
  const an=S.an, vc=an.valueCol, gc=an.groupCol;
  const numeric=colStats(vc).numeric;
  const map=new Map(); let skipped=0;
  for(const r of S.data.rows){
    const raw=String(r[vc]??"").trim(); if(raw==="")continue;
    if(numeric&&!isNum(raw)){skipped++;continue;}
    const g=gc>=0?(String(r[gc]??"").trim()||"(빈칸)"):"전체";
    if(!map.has(g))map.set(g,[]);
    map.get(g).push(numeric?parseFloat(raw):raw);
  }
  const all=[...map.entries()].map(([name,values],i)=>({name,values,ci:i%4}));
  const groups=all.filter(g=>!an.off.includes(g.name));
  return {numeric,all,groups,skipped,unit:getUnit(vc),vname:bareName(S.data.columns[vc]||"")};
}

/* ================= 통계 계산 ================= */
function mean(v){ return v.reduce((a,b)=>a+b,0)/v.length; }
function median(v){ const s=[...v].sort((a,b)=>a-b),n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; }
function modes(v){
  const m=new Map(); v.forEach(x=>m.set(x,(m.get(x)||0)+1));
  let max=0; m.forEach(c=>{if(c>max)max=c;});
  const ms=[...m.entries()].filter(([,c])=>c===max).map(([k])=>k).sort((a,b)=>typeof a==="number"?a-b:0);
  return {modes:ms,count:max,allSame:m.size>1&&ms.length===m.size};
}
function niceStep(raw,integer){
  if(raw<=0) return integer?1:0.1;
  const p=10**Math.floor(Math.log10(raw));
  const ms=integer?[1,2,5,10]:[1,2,2.5,5,10];
  let st=ms.map(m=>m*p).find(s=>s>=raw-1e-12)||10*p;
  if(integer) st=Math.max(1,Math.round(st));
  return rnd(st);
}
function getClasses(groups){
  const all=groups.flatMap(g=>g.values);
  if(!all.length) return null;
  const mn=Math.min(...all), mx=Math.max(...all);
  const allInt=all.every(Number.isInteger);
  let w=parseFloat(S.an.width), st=parseFloat(S.an.start), auto=false;
  if(!(w>0)){ w=niceStep((mx-mn||1)/6,allInt); auto=true; }
  if(!isFinite(st)||st>mn){ st=rnd(Math.floor(mn/w+1e-9)*w); if(S.an.start!=="" && parseFloat(S.an.start)>mn) auto="start"; }
  let k=Math.floor((mx-st)/w+1e-9)+1;
  let capped=false; if(k>40){k=40;capped=true;}
  const cls=Array.from({length:k},(_,i)=>[rnd(st+i*w),rnd(st+(i+1)*w)]);
  const freq=groups.map(g=>{ const f=new Array(k).fill(0); let out=0; g.values.forEach(v=>{ const i=Math.floor((v-st)/w+1e-9); if(i>=0&&i<k)f[i]++; else out++; }); return {f,out}; });
  return {start:st,width:w,k,cls,freq,auto,capped,mn,mx};
}
function catFreq(groups){
  const tot=new Map(); groups.forEach(g=>g.values.forEach(v=>tot.set(v,(tot.get(v)||0)+1)));
  const cats=[...tot.entries()].sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  return {cats,freq:groups.map(g=>cats.map(c=>g.values.filter(v=>v===c).length))};
}

function quart(v){
  const s=[...v].sort((a,b)=>a-b),n=s.length;
  const md=a=>{const m=a.length;return m%2?a[(m-1)/2]:(a[m/2-1]+a[m/2])/2;};
  const lower=s.slice(0,Math.floor(n/2)), upper=s.slice(Math.ceil(n/2));
  return {min:s[0],q1:lower.length?md(lower):s[0],med:md(s),q3:upper.length?md(upper):s[n-1],max:s[n-1],s,lower,upper,n};
}
function axisTicks(mn,mx,allInt,pad){
  const st=niceStep((mx-mn||1)/6,allInt);
  let lo=rnd(Math.floor(mn/st+1e-9)*st), hi=rnd(Math.ceil(mx/st-1e-9)*st);
  if(pad){ if(lo>=mn)lo=rnd(lo-st); if(hi<=mx)hi=rnd(hi+st); }
  if(hi<=lo)hi=rnd(lo+st);
  const t=[]; for(let v=lo;v<=hi+1e-9;v+=st)t.push(rnd(v));
  return {lo,hi,t};
}
function getPairs(G){
  const an=S.an, xc=an.valueCol, yc=an.yCol, gc=an.groupCol, ci={};
  G.all.forEach(g=>ci[g.name]=g.ci);
  const map=new Map();
  for(const r of S.data.rows){
    const a=String(r[xc]??"").trim(), b=String(r[yc]??"").trim();
    if(!isNum(a)||!isNum(b))continue;
    const g=gc>=0?(String(r[gc]??"").trim()||"(빈칸)"):"전체";
    if(an.off.includes(g))continue;
    if(!map.has(g))map.set(g,[]);
    map.get(g).push([parseFloat(a),parseFloat(b)]);
  }
  return [...map.entries()].map(([name,pts],i)=>({name,pts,ci:ci[name]!==undefined?ci[name]:i%4}));
}

    <p class="note" style="margin:6px 0 0">열 이름 아래 '단위' 칸에 단위를 적으면 표와 그래프에 단위가 함께 나와요. 예: cm, kg, 초. '집단' 열에 1반·2반처럼 적으면 두 집단을 비교할 수 있어요.</p>

function loadExample(key){

  ensureAn(); save(); render(); toast(msg);
}
function parseDelimited(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const d=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===d){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!=="")).map(r=>r.map(c=>c.trim()));
}
function loadFile(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    const buf=new Uint8Array(fr.result); let text;
    try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ try{ text=new TextDecoder("euc-kr").decode(buf); }catch(e2){ text=new TextDecoder().decode(buf); } }
    const rows=parseDelimited(text);
    if(rows.length<2){ toast("파일에서 자료를 찾지 못했어요. 첫 줄은 열 이름, 둘째 줄부터 자료인 CSV인지 확인해 주세요."); return; }
    const w=Math.max(...rows.map(r=>r.length));
    const cols=rows[0].concat(Array(w-rows[0].length).fill("")).map((c,i)=>c||`열${i+1}`);
    S.dataKey="file";
    S.data={title:file.name.replace(/\.[^.]+$/,""),columns:cols,rows:rows.slice(1).map(r=>r.concat(Array(w-r.length).fill(""))),units:[]};
    S.an.valueCol=-1; S.an.groupCol=-2; S.an.start=""; S.an.width=""; S.an.off=[]; S.an.scale={}; S.problemFromEx=false;
    ensureAn(); save(); render(); toast(`${file.name}에서 자료 ${S.data.rows.length}개를 불러왔어요.`);
  };
  fr.onerror=()=>toast("파일을 읽지 못했어요. 다른 파일로 다시 시도해 주세요.");
  fr.readAsArrayBuffer(file);
}
function pasteGrid(r0,c0,text){
  const lines=text.replace(/\r/g,"").replace(/\n+$/,"").split("\n").map(l=>l.split("\t"));
  const allEmpty=S.data.rows.every(r=>r.every(c=>String(c??"").trim()===""));
  if(allEmpty&&r0===0&&c0===0&&lines.length>1&&lines[0].some(c=>c.trim()!==""&&!isNum(c))&&lines[1].some(isNum)){
    const hdr=lines.shift(); S.data.columns=hdr.map((h,i)=>h.trim()||`열${i+1}`); S.data.units=[];
  }
  const needC=c0+Math.max(...lines.map(l=>l.length));
  while(S.data.columns.length<needC) S.data.columns.push(`열${S.data.columns.length+1}`);
  const W=S.data.columns.length;
  S.data.rows.forEach(r=>{while(r.length<W)r.push("");});
  lines.forEach((l,i)=>{ const ri=r0+i; while(S.data.rows.length<=ri)S.data.rows.push(Array(W).fill("")); l.forEach((v,j)=>S.data.rows[ri][c0+j]=v.trim()); });
  S.dataKey="custom"; S.problemFromEx=false; dataChanged();
  const ti=$("#tbl"); if(ti){ refreshTable(); document.querySelectorAll(".src").forEach(s=>s.classList.remove("on")); }
  toast(`${lines.length}행을 붙여넣었어요.`);
}

function gdot(g){ return `<i style="background:var(--g${g.ci+1})"></i>`; }
function statsHTML(G,forceAll){
  const st=S.an.stats, num=G.numeric, u=G.unit;
  if(!G.groups.length) return "";
  const cards=[];
  const show=k=>forceAll||st[k];
  if(num&&show("mean")) cards.push(`<div class="stat"><h4>평균</h4>${G.groups.map(g=>{const m=mean(g.values);return `<div class="sv"><span class="gname">${gdot(g)}${esc(g.name)}</span><span class="num">${fmt(m)}</span><span class="unit">${esc(u)}</span></div>`;}).join("")}
    ${forceAll?"":`<details><summary>구하는 과정</summary><div class="proc">${G.groups.map(g=>{const s=g.values.reduce((a,b)=>a+b,0);const m=s/g.values.length;return `<div><b>${esc(g.name)}</b> · (변량의 총합) ÷ (변량의 개수) = ${fmt(s,4)} ÷ ${g.values.length} = ${fmt(m,4)}${fmt(m)!==fmt(m,4)?` → 약 ${fmt(m)}`:""}</div>`;}).join("")}<div>소수점 아래 셋째 자리에서 반올림했어요.</div></div></details>`}</div>`);
  if(num&&show("median")) cards.push(`<div class="stat"><h4>중앙값</h4>${G.groups.map(g=>`<div class="sv"><span class="gname">${gdot(g)}${esc(g.name)}</span><span class="num">${fmt(median(g.values))}</span><span class="unit">${esc(u)}</span></div>`).join("")}
    ${forceAll?"":`<details><summary>구하는 과정</summary><div class="proc">${G.groups.map(g=>{const s=[...g.values].sort((a,b)=>a-b),n=s.length;const mid=n%2?[(n-1)/2]:[n/2-1,n/2];
      return `<div><b>${esc(g.name)}</b> · 작은 값부터 크기순으로 나열 (${n}개, ${n%2?"홀수":"짝수"})<div class="seq">${s.map((v,i)=>mid.includes(i)?`<mark>${v}</mark>`:v).join(", ")}</div>${n%2?`${(n+1)/2}번째 값 = ${s[mid[0]]}`:`${n/2}번째와 ${n/2+1}번째 값의 평균 = (${s[mid[0]]} + ${s[mid[1]]}) ÷ 2 = ${fmt((s[mid[0]]+s[mid[1]])/2)}`}</div>`;}).join("")}</div></details>`}</div>`);
  if(show("mode")) cards.push(`<div class="stat"><h4>최빈값</h4>${G.groups.map(g=>{const r=modes(g.values);return `<div class="sv"><span class="gname">${gdot(g)}${esc(g.name)}</span>${r.allSame?`<span class="unit">모든 값의 도수가 같아요</span>`:`<span class="num">${r.modes.map(esc).join(", ")}</span><span class="unit">${num?esc(u)+" ":""}(${r.count}${num?"번":esc(cU())})</span>`}</div>`;}).join("")}
    ${forceAll?"":`<details><summary>구하는 과정</summary><div class="proc">자료에서 가장 많이 나타나는 값을 찾아요. 가장 많이 나타나는 값이 여러 개이면 최빈값도 여러 개예요.${G.groups.map(g=>{const r=modes(g.values);return `<div><b>${esc(g.name)}</b> · ${r.allSame?"모든 값이 같은 횟수로 나타나서 최빈값으로 자료의 특징을 나타내기 어려워요.":`${r.modes.map(esc).join(", ")}이(가) 각각 ${r.count}번으로 가장 많이 나타나요.`}</div>`;}).join("")}</div></details>`}</div>`);
  if(!cards.length) return "";
  return `<div class="stats">${cards.join("")}</div>`;
}
const PANEL_ORDER=["stem","table","chart","box","scatter"];
function panelKinds(){ const s=S.an.sel||{}; return PANEL_ORDER.filter(k=>k==="chart"?(s.hist||s.poly):s[k]); }
function panelTitle(G,k){
  const an=S.an, rel=an.rel;
  if(k==="stem") return "줄기와 잎 그림";
  if(k==="box") return "상자그림";
  if(k==="scatter") return an.yCol>=0?`산점도 (가로축: ${colLabel(an.valueCol)}, 세로축: ${colLabel(an.yCol)})`:"산점도";
  if(k==="table") return rel?"상대도수의 분포표":"도수분포표";
  if(!G.numeric) return rel?"상대도수 막대그래프":"막대그래프";
  const p=[]; if(an.sel.hist)p.push("히스토그램"); if(an.sel.poly)p.push("도수분포다각형");
  return rel?`상대도수의 분포를 나타낸 그래프 (${p.join(" · ")})`:p.join("과 ");
}
function legendHTML(G){
  if(S.an.groupCol<0) return `<div class="legend"><span class="muted">자료 ${G.groups[0]?G.groups[0].values.length:0}개</span></div>`;
  return `<div class="legend">${G.groups.map(g=>`<span><i style="background:var(--g${g.ci+1})"></i>${esc(g.name)} (${g.values.length})</span>`).join("")}</div>`;
}
function panelsHTML(G,cl){
  const an=S.an;
  if(!G.groups.length) return [`<div class="empty">분석할 자료가 없어요. 자료 수집 탭에서 자료를 입력하거나 집단을 다시 켜 주세요.</div>`];
  const ks=panelKinds();
  if(!ks.length) return [`<div class="empty">위에서 그래프 버튼을 눌러 보세요. 여러 개를 고르면 차례대로 나와요.</div>`];
  const nonum=nm=>`<div class="empty">${nm}은 수로 된 자료에서 그릴 수 있어요.</div>`;
  return ks.map(k=>{
    const head=`<div class="vhead"><div><h3>${esc(S.data.title||"자료")}</h3><div class="sub">${esc(panelTitle(G,k))}${an.groupCol>=0?` · ${esc(S.data.columns[an.groupCol])}별 비교${G.groups.length>1?(an.mode==="overlay"?" (겹쳐보기)":" (따로보기)"):""}`:""}</div></div>${legendHTML(G)}</div>`;
    let body;
    if(k==="stem") body=G.numeric?stemHTML(G):nonum("줄기와 잎 그림");
    else if(k==="box") body=G.numeric?boxHTML(G):nonum("상자그림");
    else if(k==="scatter") body=G.numeric?scatterHTML(G):nonum("산점도");
    else if(k==="table") body=G.numeric?freqTableHTML(G,cl):catTableHTML(G);
    else body=G.numeric?numChartHTML(G,cl):catChartHTML(G);
    return head+body;
  });
}
/* 줄기와 잎 */
function stemHTML(G){
  const all=G.groups.flatMap(g=>g.values);
  if(all.some(v=>v<0)) return `<div class="empty">음수가 있는 자료는 줄기와 잎 그림으로 나타내지 않아요.</div>`;
  const allInt=all.every(Number.isInteger), sc=allInt?1:10;
  const sl=v=>{const t=Math.round(v*sc);return [Math.floor(t/10),t%10];};
  const stems=all.map(v=>sl(v)[0]); const s0=Math.min(...stems), s1=Math.max(...stems);
  if(s1-s0>60) return `<div class="empty">값의 범위가 너무 넓어 줄기가 ${s1-s0+1}개나 돼요. 도수분포표나 히스토그램으로 살펴보세요.</div>`;
  const leafs=g=>{const m={}; for(let s=s0;s<=s1;s++)m[s]=[]; g.values.forEach(v=>{const[a,b]=sl(v);m[a].push(b);}); for(const s in m)m[s].sort((x,y)=>x-y); return m;};
  const v0=G.groups[0].values[0], [ks,kl]=sl(v0), kv=(ks*10+kl)/sc;
  const key=`<div class="slkey">(${ks} | ${kl}은 ${kv}${esc(G.unit)})</div>`;
  const range=[]; for(let s=s0;s<=s1;s++)range.push(s);
  if(G.groups.length===2&&S.an.mode==="overlay"){
    const [A,B]=G.groups, la=leafs(A), lb=leafs(B);
    return `<div class="svgwrap"><table class="sl"><thead><tr><th>잎 <span class="gh">${esc(A.name)}</span></th><th>줄기</th><th>잎 <span class="gh">${esc(B.name)}</span></th></tr></thead><tbody>
      ${range.map(s=>`<tr><td class="lf left" style="color:var(--g${A.ci+1})">${[...la[s]].reverse().join(" ")}</td><td class="stem">${s}</td><td class="lf" style="color:var(--g${B.ci+1})">${lb[s].join(" ")}</td></tr>`).join("")}
    </tbody></table></div>${key}<p class="note" style="text-align:center;margin:4px 0 0">줄기를 가운데 두고 ${esc(A.name)}의 잎은 왼쪽, ${esc(B.name)}의 잎은 오른쪽에 나타냈어요.</p>`;
  }
  return `<div class="tables">${G.groups.map(g=>{const l=leafs(g);return `<div class="slbox">${S.an.groupCol>=0?`<h5>${gdot(g)}${esc(g.name)}</h5>`:""}<table class="sl"><thead><tr><th>줄기</th><th style="text-align:left">잎</th></tr></thead><tbody>${range.map(s=>`<tr><td class="stem only" style="border-left:0">${s}</td><td class="lf">${l[s].join(" ")}</td></tr>`).join("")}</tbody></table></div>`;}).join("")}</div>${key}`;
}
/* 도수분포표 */
function relStr(f,n){ return n?fmt(f/n,2):"0"; }
function freqTableHTML(G,cl){

    ${gs.length>1||S.an.groupCol>=0?`<tr><th rowspan="2">${esc(G.vname)}${u?`(${esc(u)})`:""}</th>${gs.map(g=>`<th colspan="${rel?2:1}"><span class="gh">${gdot(g)}${esc(g.name)}</span></th>`).join("")}</tr><tr>${gs.map(()=>`<th>도수(${esc(cU())})</th>${rel?"<th>상대도수</th>":""}`).join("")}</tr>`
     :`<tr><th>${esc(G.vname)}${u?`(${esc(u)})`:""}</th><th>도수(${esc(cU())})</th>${rel?"<th>상대도수</th>":""}</tr>`}
    </thead><tbody>${cl.cls.map((c,i)=>`<tr><td>${c[0]}<span class="muted small"> 이상</span> ~ ${c[1]}<span class="muted small"> 미만</span></td>${idxs.map(gi=>{const f=cl.freq[gi].f[i],n=G.groups[gi].values.length;return `<td class="num">${f}</td>${rel?`<td class="num">${relStr(f,n)}</td>`:""}`;}).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td>합계</td>${idxs.map(gi=>`<td class="num">${G.groups[gi].values.length}</td>${rel?`<td class="num">1</td>`:""}`).join("")}</tr></tfoot></table>`;
  const out=cl.freq.some(f=>f.out)?`<p class="note" style="text-align:center">계급 밖의 값이 있어요. 첫 계급의 시작값을 확인해 주세요.</p>`:"";

  if(sep) return `<div class="tables">${G.groups.map((g,i)=>one([g],[i])).join("")}</div>${relnote}${out}`;

function catTableHTML(G){
  const rel=S.an.rel, cf=catFreq(G.groups), sep=S.an.mode==="separate"&&G.groups.length>1;
  const one=idxs=>`<table class="ft"><thead>${S.an.groupCol>=0?`<tr><th rowspan="2">${esc(G.vname)}</th>${idxs.map(i=>`<th colspan="${rel?2:1}"><span class="gh">${gdot(G.groups[i])}${esc(G.groups[i].name)}</span></th>`).join("")}</tr><tr>${idxs.map(()=>`<th>도수(${esc(cU())})</th>${rel?"<th>상대도수</th>":""}`).join("")}</tr>`:`<tr><th>${esc(G.vname)}</th><th>도수(${esc(cU())})</th>${rel?"<th>상대도수</th>":""}</tr>`}</thead>
   <tbody>${cf.cats.map((c,ci)=>`<tr><td>${esc(c)}</td>${idxs.map(i=>{const f=cf.freq[i][ci],n=G.groups[i].values.length;return `<td class="num">${f}</td>${rel?`<td class="num">${relStr(f,n)}</td>`:""}`;}).join("")}</tr>`).join("")}</tbody>
   <tfoot><tr><td>합계</td>${idxs.map(i=>`<td class="num">${G.groups[i].values.length}</td>${rel?`<td class="num">1</td>`:""}`).join("")}</tr></tfoot></table>`;
  if(sep) return `<div class="tables">${G.groups.map((_,i)=>one([i])).join("")}</div>`;

}
/* 그래프 (SVG) */
function yTicks(max,rel){
  const step=rel?niceStep(max/5,false):niceStep(max/5,true);
  let top=Math.ceil(max/step-1e-9)*step; if(top<=0)top=step;
  const t=[]; for(let v=0;v<=top+1e-9;v+=step)t.push(rnd(v));
  return {top:rnd(top),ticks:t};
}
let chartSeq=0;
function ticksTo(top,rel){ const st=niceStep(top/5,!rel); const t=[]; for(let v=0;v<=top+1e-9;v=rnd(v+st))t.push(v); return t; }
function ticksRange(lo,hi,intish){ const st=niceStep((hi-lo)/6,intish); const t=[]; for(let v=rnd(Math.ceil(lo/st-1e-9)*st);v<=hi+1e-9;v=rnd(v+st))t.push(v); return t; }
function axBand(axis,key,lo,hi,p0,len,min,max,x,y,w,h){ return `<rect class="axdrag ${axis}d" x="${x}" y="${y}" width="${w}" height="${h}" data-key="${key}" data-axis="${axis}" data-lo="${lo}" data-hi="${hi}" data-p0="${p0}" data-len="${len}" data-min="${min}" data-max="${max}"><title>${axis==="x"?"좌우로 끌어 가로축":"위아래로 끌어 세로축"}의 비율 바꾸기</title></rect>`; }
function axNote(){ const on=Object.keys(S.an.scale||{}).length>0; return `<div class="row no-cap" style="margin-top:8px;gap:10px"><span class="note">가로축·세로축의 눈금 부분을 끌면 좌표평면의 비율을 바꿀 수 있어요. 같은 자료도 축의 비율에 따라 다르게 보여요.</span>${on?`<button class="btn" data-axreset type="button">축 원래대로</button>`:""}</div>`; }
function numChartHTML(G,cl){
  const an=S.an, rel=an.rel, sep=an.mode==="separate"&&G.groups.length>1;
  if(!an.sel.hist&&!an.sel.poly) return `<div class="empty">히스토그램이나 도수분포다각형 버튼을 눌러 보세요.</div>`;
  const ys=G.groups.map((g,i)=>cl.freq[i].f.map(f=>rel?(g.values.length?f/g.values.length:0):f));
  const ymax=Math.max(...ys.flat(),rel?0.05:1);
  const yt=yTicks(ymax,rel);
  const draw=(idxs,H,title)=>{
    const W=760,L=62,R=40,T=title?40:26,B=52, pw=W-L-R, ph=H-T-B, base=T+ph, sc=an.scale||{};
    const x0=an.sel.poly?cl.start-cl.width:cl.start, xDef=an.sel.poly?cl.start+(cl.k+1)*cl.width:cl.start+cl.k*cl.width;
    const x1=sc.hx>x0?sc.hx:xDef, yTop=sc.hy>0?sc.hy:yt.top, yTk=sc.hy>0?ticksTo(yTop,rel):yt.ticks;
    const brk=x0>0, GAP=brk?38:0, px0=L+GAP, ppw=pw-GAP;

    if(title) s+=`<text class="gtitle" x="${L}" y="20">${title}</text>`;
    yTk.forEach(v=>{ s+=`<line class="gridl" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${rel?fmt(v,2):v}</text>`; });

    const op=idxs.length>1?0.22:0.42;
    s+=`<g clip-path="url(#${cid})">`;
    if(an.sel.hist) idxs.forEach(gi=>{ const g=G.groups[gi]; ys[gi].forEach((y,i)=>{ if(y<=0)return; const a=X(cl.cls[i][0]),b=X(cl.cls[i][1]); s+=`<rect class="bar c${g.ci}" x="${a}" y="${Y(y)}" width="${b-a}" height="${Y(0)-Y(y)}" fill-opacity="${op}"/>`; }); });
    if(an.sel.poly) idxs.forEach(gi=>{ const g=G.groups[gi]; const pts=[[cl.start-cl.width/2,0],...ys[gi].map((y,i)=>[cl.cls[i][0]+cl.width/2,y]),[cl.start+cl.k*cl.width+cl.width/2,0]];
      s+=`<polyline class="poly c${g.ci}" points="${pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(" ")}"/>`;
      pts.forEach(p=>s+=`<circle class="pt c${g.ci}" cx="${X(p[0])}" cy="${Y(p[1])}" r="4.2"/>`); });
    s+=`</g>`;
    if(idxs.length===1){ const gi=idxs[0], g=G.groups[gi]; ys[gi].forEach((y,i)=>{ const mid=cl.cls[i][0]+cl.width/2; if(y<=0||y>yTop||mid>x1)return; s+=`<text class="vlabel c${g.ci}" x="${X(mid)}" y="${Y(y)-(an.sel.poly&&an.sel.hist?13:9)}" text-anchor="middle">${rel?fmt(y,2):y}</text>`; }); }
    s+=`<line class="axis" x1="${L}" x2="${L+pw}" y1="${base}" y2="${base}"/><line class="axis" x1="${L}" x2="${L}" y1="${T-6}" y2="${base}"/>`;
    if(brk){ const xb=L+GAP/2; s+=`<rect class="brkbg" x="${xb-4}" y="${base-3}" width="8" height="6"/><path class="brk" d="M${xb-4},${base-9} q4.5,4.5 0,9 q-4.5,4.5 0,9"/><path class="brk" d="M${xb+4},${base-9} q4.5,4.5 0,9 q-4.5,4.5 0,9"/>`; }
    s+=`<text class="alabel" x="6" y="${T-12}">${rel?"(상대도수)":`(${esc(cU())})`}</text>`;
    s+=`<text class="alabel" x="${W-4}" y="${base+40}" text-anchor="end">${G.unit?`${esc(G.vname)}(${esc(G.unit)})`:esc(G.vname)}</text>`;
    s+=axBand("x","hx",x0,x1,px0,ppw,x0+(xDef-x0)*0.25,x0+(xDef-x0)*6,px0,base-4,ppw,32);

    return s+"</svg>";
  };
  const out=(cl.freq.some(f=>f.out)?`<p class="note">계급 밖의 값이 있어요. 첫 계급의 시작값을 확인해 주세요.</p>`:"")+axNote();
  if(sep) return `<div class="sepcharts">${G.groups.map((g,i)=>`<div class="svgwrap">${draw([i],300,`<tspan style="fill:var(--g${g.ci+1})">●</tspan> ${esc(g.name)}`)}</div>`).join("")}</div><p class="note" style="margin:6px 0 0">비교하기 쉽도록 두 그래프의 가로축과 세로축 눈금을 같게 맞췄어요.</p>${out}`;
  return `<div class="svgwrap">${draw(G.groups.map((_,i)=>i),420,"")}</div>${out}`;

function catChartHTML(G){

    const W=760,L=62,R=24,T=title?40:26,B=46,pw=W-L-R,ph=H-T-B, n=cf.cats.length, slot=pw/n, bw=Math.min(46,slot*0.72/idxs.length);
    const sc=an.scale||{}, yTop=sc.by>0?sc.by:yt.top, yTk=sc.by>0?ticksTo(yTop,rel):yt.ticks;
    const Y=v=>T+ph-(Math.min(v,yTop)/yTop)*ph;
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(panelTitle(G,"chart"))}">`;

    yTk.forEach(v=>{ s+=`<line class="gridl" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${rel?fmt(v,2):v}</text>`; });
    cf.cats.forEach((c,ci)=>{ const cx=L+slot*(ci+.5); const start=cx-bw*idxs.length/2;
      idxs.forEach((gi,k)=>{ const g=G.groups[gi], y=ys[gi][ci]; const x=start+k*bw; if(y>0) s+=`<rect class="bar c${g.ci}" x="${x+1}" y="${Y(y)}" width="${bw-2}" height="${Y(0)-Y(y)}" fill-opacity="0.75"/>`;
        s+=`<text class="vlabel c${g.ci}" x="${x+bw/2}" y="${Y(y)-6}" text-anchor="middle">${rel?fmt(y,2):y}</text>`; });
      s+=`<text class="alabel" x="${cx}" y="${T+ph+20}" text-anchor="middle" style="fill:var(--ink)">${esc(c)}</text>`; });
    s+=`<line class="axis" x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}"/><line class="axis" x1="${L}" x2="${L}" y1="${T-6}" y2="${T+ph}"/>`;

  return `<div class="svgwrap">${draw(G.groups.map((_,i)=>i),400,"")}</div>${G.groups.length>1&&!rel&&new Set(G.groups.map(g=>g.values.length)).size>1?`<p class="note">두 집단의 자료 수가 달라요. 상대도수로 바꿔 비교해 보세요.</p>`:""}${axNote()}`;
}

/* 상자그림 */
function boxHTML(G){

    const W=760,L=named&&!title?84:40,R=40,T=title?46:20,rowH=96,B=54,H=T+rowH*idxs.length+B,pw=W-L-R,base=T+rowH*idxs.length;

    idxs.forEach((gi,k)=>{

      s+=`<line class="whisk ${c}" x1="${X(q.min)}" x2="${X(q.q1)}" y1="${cy}" y2="${cy}"/><line class="whisk ${c}" x1="${X(q.q3)}" x2="${X(q.max)}" y1="${cy}" y2="${cy}"/>`;
      s+=`<line class="whisk ${c}" x1="${X(q.min)}" x2="${X(q.min)}" y1="${cy-bh/4}" y2="${cy+bh/4}"/><line class="whisk ${c}" x1="${X(q.max)}" x2="${X(q.max)}" y1="${cy-bh/4}" y2="${cy+bh/4}"/>`;

      let prev=-1e9,lvl=0;

    });
    s+=`<line class="axis" x1="${L}" x2="${L+pw}" y1="${base}" y2="${base}"/>`;

  };

  const proc=`<details class="no-cap" style="margin-top:10px"><summary>사분위수 구하는 과정</summary><div class="proc">자료를 작은 값부터 크기순으로 나열한 뒤 중앙값을 기준으로 아래쪽과 위쪽으로 나누어요. 자료의 개수가 홀수이면 중앙값은 빼고 나눠요. 아래쪽 자료의 중앙값이 제1사분위수, 위쪽 자료의 중앙값이 제3사분위수예요.${G.groups.map((g,i)=>{const q=Q[i];return `<div><b>${esc(g.name)}</b> (${q.n}개)<div class="seq">아래쪽 ${q.lower.length}개: ${q.lower.join(", ")} → 제1사분위수 ${fmt(q.q1)}</div><div class="seq">위쪽 ${q.upper.length}개: ${q.upper.join(", ")} → 제3사분위수 ${fmt(q.q3)}</div></div>`;}).join("")}</div></details>`;
  return chart+tbl+proc;
}
/* 산점도 */
function scatterHTML(G){
  const an=S.an;
  if(an.yCol<0) return `<div class="empty">수로 된 변량이 두 개 있어야 산점도를 그릴 수 있어요. 자료 수집 탭에서 열을 하나 더 만들어 보세요.</div>`;
  const P=getPairs(G); const all=P.flatMap(g=>g.pts);
  if(!all.length) return `<div class="empty">두 변량의 값이 모두 있는 자료가 없어요.</div>`;
  const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  const ax=axisTicks(Math.min(...xs),Math.max(...xs),xs.every(Number.isInteger),true), ay=axisTicks(Math.min(...ys),Math.max(...ys),ys.every(Number.isInteger),true);
  const sc=an.scale||{}, ax0=ax.hi, ay0=ay.hi;
  if(sc.sx>ax.lo){ ax.hi=sc.sx; ax.t=ticksRange(ax.lo,ax.hi,xs.every(Number.isInteger)); }
  if(sc.sy>ay.lo){ ay.hi=sc.sy; ay.t=ticksRange(ay.lo,ay.hi,ys.every(Number.isInteger)); }
  const xn=colLabel(an.valueCol), yn=colLabel(an.yCol);
  const sep=an.mode==="separate"&&P.length>1;
  const draw=(gs,H,title)=>{
    const W=760,L=62,R=30,T=title?48:34,B=58,pw=W-L-R,ph=H-T-B;
    const X=v=>L+(v-ax.lo)/(ax.hi-ax.lo)*pw, Y=v=>T+ph-(v-ay.lo)/(ay.hi-ay.lo)*ph;
    const cid="sclip"+(++chartSeq);
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="산점도"><defs><clipPath id="${cid}"><rect x="${L-6}" y="${T-6}" width="${pw+12}" height="${ph+12}"/></clipPath></defs>`;
    if(title) s+=`<text class="gtitle" x="${L}" y="20">${title}</text>`;
    ay.t.forEach(v=>{ s+=`<line class="gridl" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`; });
    ax.t.forEach(v=>{ s+=`<line class="gridl" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+ph}"/><text class="tick" x="${X(v)}" y="${T+ph+20}" text-anchor="middle">${v}</text>`; });
    s+=`<g clip-path="url(#${cid})">`; gs.forEach(g=>g.pts.forEach(p=>{ s+=`<circle class="dot c${g.ci}" cx="${X(p[0])}" cy="${Y(p[1])}" r="5.5"/>`; })); s+=`</g>`;
    s+=`<line class="axis" x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}"/><line class="axis" x1="${L}" x2="${L}" y1="${T-6}" y2="${T+ph}"/>`;
    s+=`<text class="alabel" x="6" y="${T-14}">${esc(yn)}</text>`;
    s+=`<text class="alabel" x="${W-4}" y="${T+ph+42}" text-anchor="end">${esc(xn)}</text>`;
    s+=axBand("x","sx",ax.lo,ax.hi,L,pw,ax.lo+(ax0-ax.lo)*0.25,ax.lo+(ax0-ax.lo)*6,L,T+ph-4,pw,32);
    s+=axBand("y","sy",ay.lo,ay.hi,T+ph,ph,ay.lo+(ay0-ay.lo)*0.25,ay.lo+(ay0-ay.lo)*6,L-54,T,54,ph);
    return s+"</svg>";
  };
  const note=`<p class="note" style="margin:8px 0 0">한쪽 변량의 값이 커질 때 다른 쪽 변량의 값은 어떻게 변하는지, 점들이 어떤 모양으로 모여 있는지 살펴보세요.</p>`;
  if(sep) return `<div class="sepcharts">${P.map(g=>`<div class="svgwrap">${draw([g],380,`<tspan style="fill:var(--g${g.ci+1})">●</tspan> ${esc(g.name)} (${g.pts.length})`)}</div>`).join("")}</div><p class="note" style="margin:6px 0 0">비교하기 쉽도록 산점도의 눈금을 같게 맞췄어요.</p>${note}${axNote()}`;
  return `<div class="svgwrap">${draw(P,460,"")}</div>${note}${axNote()}`;
}

  if(!axDrag)return;
  const dist=axDrag.pos(e); if(dist<10)return;
  let hi=axDrag.lo+(axDrag.v-axDrag.lo)*axDrag.len/dist;
  hi=Math.min(axDrag.max,Math.max(axDrag.min,hi));
  S.an.scale[axDrag.key]=hi;
  if(!axRaf) axRaf=requestAnimationFrame(()=>{ axRaf=0; render(); });
});
function endAxDrag(){ if(!axDrag)return; axDrag=null; save(); render(); }
document.addEventListener("pointerup",endAxDrag); document.addEventListener("pointercancel",endAxDrag);

/* ---------- 채우기 핸들 (자동 복사) ---------- */
let fillSrc=null, drag=null;
function placeHandle(inp){
  const w=$("#tbl"), h=$("#fillH"); if(!w||!h||!inp)return;
  const td=inp.closest("td"), wr=w.getBoundingClientRect(), r=td.getBoundingClientRect();
  h.style.left=(r.right-wr.left-w.clientLeft+w.scrollLeft-6)+"px";
  h.style.top=(r.bottom-wr.top-w.clientTop+w.scrollTop-6)+"px";
  h.hidden=false; fillSrc={r:+inp.dataset.r,c:+inp.dataset.c};
}
document.addEventListener("focusin",e=>{ if(e.target.dataset&&e.target.dataset.r!==undefined) placeHandle(e.target); });
function fillCells(){
  if(!drag)return [];
  const {r,c,tr,tc}=drag, out=[];
  if(Math.abs(tr-r)>=Math.abs(tc-c)){ const a=Math.min(r,tr),b=Math.max(r,tr); for(let i=a;i<=b;i++) if(i!==r) out.push([i,c]); }
  else { const a=Math.min(c,tc),b=Math.max(c,tc); for(let j=a;j<=b;j++) if(j!==c) out.push([r,j]); }
  return out;
}
function markFill(){
  document.querySelectorAll("td.fillsel").forEach(t=>t.classList.remove("fillsel"));
  fillCells().forEach(([i,j])=>{ const el=document.querySelector(`input[data-r="${i}"][data-c="${j}"]`); if(el) el.closest("td").classList.add("fillsel"); });
}
function dragTarget(){
  const el=document.elementFromPoint(drag.x,drag.y); const td=el&&el.closest&&el.closest("#tbl td"); const inp=td&&td.querySelector("input[data-r]");
  if(inp){ drag.tr=+inp.dataset.r; drag.tc=+inp.dataset.c; }
  markFill();
}
function dragLoop(){
  if(!drag)return;
  const w=$("#tbl");
  if(w){ const b=w.getBoundingClientRect(); if(drag.y>b.bottom-28) w.scrollTop+=12; else if(drag.y<b.top+80) w.scrollTop-=12; if(drag.x>b.right-28) w.scrollLeft+=12; else if(drag.x<b.left+50) w.scrollLeft-=12; }
  dragTarget(); requestAnimationFrame(dragLoop);
}
function applyFill(cells,src){
  if(!cells.length)return;
  const v=S.data.rows[src.r][src.c];
  cells.forEach(([i,j])=>S.data.rows[i][j]=v);
  S.dataKey="custom"; S.an.start=""; S.an.width=""; save();
  refreshTable([src.r,src.c]); document.querySelectorAll(".src").forEach(s=>s.classList.remove("on"));
  toast(`${cells.length}칸에 '${v}'을(를) 복사했어요.`);
}
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest&&e.target.closest("#fillH"); if(!h||!fillSrc)return;
  e.preventDefault(); try{h.setPointerCapture(e.pointerId);}catch(_){}
  drag={r:fillSrc.r,c:fillSrc.c,tr:fillSrc.r,tc:fillSrc.c,x:e.clientX,y:e.clientY};
  requestAnimationFrame(dragLoop);
});
document.addEventListener("pointermove",e=>{ if(drag){ drag.x=e.clientX; drag.y=e.clientY; } });
function endDrag(){
  if(!drag)return;
  dragTarget();
  const cells=fillCells(), src={r:drag.r,c:drag.c}; drag=null;
  document.querySelectorAll("td.fillsel").forEach(t=>t.classList.remove("fillsel"));
  applyFill(cells,src);
}
document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",endDrag);
document.addEventListener("dblclick",e=>{
  if(!(e.target.closest&&e.target.closest("#fillH"))||!fillSrc)return; e.preventDefault();
  const {r,c}=fillSrc, numCol=/번호/.test(S.data.columns[0]||"");
  let last=-1; S.data.rows.forEach((row,i)=>{ if(row.some((v,j)=>j!==c&&!(j===0&&numCol)&&String(v??"").trim()!==""))last=i; });
  if(last<=r) last=S.data.rows.length-1;
  const cells=[]; for(let i=r+1;i<=last;i++){ if(String(S.data.rows[i][c]??"").trim()!=="")break; cells.push([i,c]); }
  if(!cells.length){ toast("아래에 채울 빈칸이 없어요."); return; }
  applyFill(cells,{r,c});
});

render();
})();
</script>
